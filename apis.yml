aid: leantaas
name: LeanTaaS
description: 'LeanTaaS is a healthcare capacity-management software company founded in 2010 and headquartered
  in Santa Clara, California. Its iQueue product line applies lean principles and predictive and prescriptive
  machine learning to hospital operations, helping health systems raise utilization of assets they already
  own — operating rooms, infusion chairs and inpatient beds — instead of building new capacity. Products
  include iQueue for Operating Rooms, iQueue for Infusion Centers, iQueue for Inpatient Flow, the iQueue
  Autopilot generative-AI layer, and accompanying transformation services. LeanTaaS reports serving more
  than 1,000 hospitals and centers across the United States and has been majority-owned by Bain Capital
  since 2022. LeanTaaS operates no public API program: there is no developer portal, API reference, OpenAPI
  description, SDK or sandbox, and EHR integration is contracted per health system rather than published.'
